{% extends "base.html" %}

{% block title %}商品詳細{% endblock %}

{% block content %}
<h1>商品詳細</h1>

<p>商品名：{{ object.name }}</p>
<p>価格：{{ object.price }} 円</p>
<p>カテゴリ：{{ object.category }}</p>
<p>商品説明：{{ object.description }}</p>

{% if object.image %}
    <img src="{{ object.image }}" width="300">
{% endif %}

<a href="{% url 'list' %}">一覧へ戻る</a>

{% endblock %}
